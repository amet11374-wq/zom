<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Камера 1000x Zoom</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: monospace; touch-action: none; }
        video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform-origin: center center; }
        canvas { position: fixed; top: 0; left: 0; display: block; z-index: 2; }
        #info { position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.65); padding: 10px 15px; border-radius: 8px; pointer-events: none; font-size: 14px; z-index: 3; }
        .btns { position: fixed; bottom: 25px; right: 20px; display: flex; gap: 10px; z-index: 3; }
        button { background: #00ff88; color: #111; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; font-family: monospace; font-size: 14px; cursor: pointer; }
        #switchBtn { background: #fff; }
    </style>
</head>
<body>
    <video id="cam" autoplay playsinline muted></video>
    <div id="info">Камера + Линия 1000x<br>Масштаб: <span id="zoomVal">1.00x</span> (<span id="camInfo">Cam 1</span>)</div>
    <div class="btns">
        <button id="switchBtn" onclick="switchLens()">Камера</button>
        <button id="resetBtn" onclick="resetView()">Сброс (1x)</button>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const video = document.getElementById('cam');
        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
        let width, height, scale = 1, offsetX = 0, isDragging = false, startX = 0, initialPinchDist = null, initialScale = 1;
        let allCameras = [], currentCamIdx = 0, currentStream = null;

        async function startCamera(deviceId) {
            if (currentStream) {
                currentStream.getTracks().forEach(t => t.stop());
            }
            const constraints = deviceId
                ? { video: { deviceId: { exact: deviceId }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false }
                : { video: { facingMode: 'environment', width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                video.srcObject = stream;

                if (allCameras.length === 0) {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    allCameras = devices.filter(d => d.kind === 'videoinput');
                }
                document.getElementById('camInfo').textContent = `${currentCamIdx + 1}/${allCameras.length}`;
            } catch (e) {
                document.getElementById('info').innerHTML = 'Разрешите доступ к камере';
            }
        }

        function switchLens() {
            if (allCameras.length <= 1) return;
            currentCamIdx = (currentCamIdx + 1) % allCameras.length;
            startCamera(allCameras.item(currentCamIdx).deviceId);
        }

        startCamera();

        function resetView() { scale = 1; offsetX = window.innerWidth / 2; draw(); }
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; draw(); }
        window.addEventListener('resize', resize);

        function draw() {
            if (isNaN(offsetX) || isNaN(scale)) { resetView(); return; }

            // Полный зум камеры синхронно с линией до 1000x
            const camScale = Math.max(1, Math.min(scale, 1000));
            video.style.transform = `scale(${camScale})`;

            ctx.clearRect(0, 0, width, height);
            const baseStep = 80, log10 = Math.floor(Math.log10(scale)), stepValue = Math.pow(10, -log10), pixelStep = baseStep * scale * stepValue, centerY = height / 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.fillRect(0, centerY - 25, width, 75);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(width, centerY); ctx.stroke();
            const startIdx = Math.floor((-offsetX) / pixelStep) - 1, endIdx = Math.ceil((width - offsetX) / pixelStep) + 1;
            ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
            for (let i = startIdx; i <= endIdx; i++) {
                const cleanNum = Number((i * stepValue).toPrecision(12));
                const x = offsetX + i * pixelStep;
                ctx.strokeStyle = '#00ff88'; ctx.beginPath(); ctx.moveTo(x, centerY - 15); ctx.lineTo(x, centerY + 15); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.fillText(cleanNum.toString(), x, centerY + 35);
            }
            const zoomEl = document.getElementById('zoomVal');
            if (zoomEl) zoomEl.textContent = scale >= 1000 ? scale.toExponential(2) + 'x' : scale.toFixed(2) + 'x';
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const z = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            offsetX = e.clientX - (e.clientX - offsetX) * z;
            scale = Math.max(0.01, Math.min(scale * z, 1e6));
            draw();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - offsetX; });
        window.addEventListener('mousemove', (e) => { if (isDragging) { offsetX = e.clientX - startX; draw(); } });
        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { isDragging = true; startX = e.touches.item(0).clientX - offsetX; }
            else if (e.touches.length === 2) {
                isDragging = false;
                const t1 = e.touches.item(0), t2 = e.touches.item(1);
                initialPinchDist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                initialScale = scale;
            }
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) { offsetX = e.touches.item(0).clientX - startX; draw(); }
            else if (e.touches.length === 2 && initialPinchDist > 0) {
                const t1 = e.touches.item(0), t2 = e.touches.item(1);
                const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                const midX = (t1.clientX + t2.clientX) / 2;
                const newScale = Math.max(0.01, Math.min(initialScale * (dist / initialPinchDist), 1e6));
                offsetX = midX - (midX - offsetX) * (newScale / scale);
                scale = newScale; draw();
            }
        }, { passive: false });
        canvas.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null; });

        offsetX = window.innerWidth / 2; resize();
    </script>
</body>
</html>
