<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>1000x Zoom Цифр</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: monospace; touch-action: none; }
        canvas { display: block; }
        #info { position: fixed; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; pointer-events: none; font-size: 14px; }
    </style>
</head>
<body>
    <div id="info">Раздвигайте пальцы для зума | Тяните для сдвига<br>Масштаб: <span id="zoomVal">1x</span></div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d'), zoomVal = document.getElementById('zoomVal');
        let width, height, scale = 1, offsetX = 0, isDragging = false, startX = 0, initialPinchDist = null, initialScale = 1;

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; draw(); }
        window.addEventListener('resize', resize);

        function draw() {
            ctx.fillStyle = '#111'; ctx.fillRect(0, 0, width, height);
            const baseStep = 100, log10 = Math.floor(Math.log10(scale)), stepValue = Math.pow(10, -log10), pixelStep = baseStep * scale * stepValue, centerY = height / 2;
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(width, centerY); ctx.stroke();
            const startNum = Math.floor((-offsetX) / pixelStep) * stepValue, endNum = Math.ceil((width - offsetX) / pixelStep) * stepValue;
            ctx.font = '14px monospace'; ctx.textAlign = 'center';
            for (let num = startNum; num <= endNum; num += stepValue) {
                const cleanNum = Number(num.toPrecision(12)), x = offsetX + (cleanNum / stepValue) * pixelStep;
                ctx.strokeStyle = '#00ff88'; ctx.beginPath(); ctx.moveTo(x, centerY - 15); ctx.lineTo(x, centerY + 15); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.fillText(cleanNum.toString(), x, centerY + 35);
            }
            zoomVal.textContent = scale >= 1000 ? scale.toExponential(2) + 'x' : scale.toFixed(2) + 'x';
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const z = e.deltaY < 0 ? 1.15 : 1 / 1.15;
            offsetX = e.clientX - (e.clientX - offsetX) * z;
            scale = Math.max(0.01, Math.min(scale * z, 1e6));
            draw();
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - offsetX; });
        window.addEventListener('mousemove', (e) => { if (isDragging) { offsetX = e.clientX - startX; draw(); } });
        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) { isDragging = true; startX = e.touches.clientX - offsetX; }
            else if (e.touches.length === 2) { isDragging = false; initialPinchDist = Math.hypot(e.touches.clientX - e.touches.clientX, e.touches.clientY - e.touches.clientY); initialScale = scale; }
        });
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && isDragging) { offsetX = e.touches.clientX - startX; draw(); }
            else if (e.touches.length === 2 && initialPinchDist) {
                const dist = Math.hypot(e.touches.clientX - e.touches.clientX, e.touches.clientY - e.touches.clientY);
                const midX = (e.touches.clientX + e.touches.clientX) / 2;
                const newScale = Math.max(0.01, Math.min(initialScale * (dist / initialPinchDist), 1e6));
                offsetX = midX - (midX - offsetX) * (newScale / scale);
                scale = newScale; draw();
            }
        }, { passive: false });
        canvas.addEventListener('touchend', () => { isDragging = false; initialPinchDist = null; });

        offsetX = window.innerWidth / 2; resize();
    </script>
</body>
</html>
